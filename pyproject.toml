[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# S311 inline exception covers seeded demo randomness used for deterministic simulation, not security.
# S105 inline exception covers the public local-only JWT fallback rejected outside local mode.
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
