[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# S311 inline exceptions cover only seeded, non-security simulation fixtures.
# S105/S106 inline exceptions cover only intentional JWT rejection/acceptance fixtures.
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
