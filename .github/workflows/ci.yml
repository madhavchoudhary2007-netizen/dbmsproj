name: CI

on:
  push:
    branches: [perfection-loop]
  pull_request:
    branches: [perfection-loop]

permissions:
  contents: read

jobs:
  full-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install Playwright Chromium
        run: npm --prefix frontend exec -- playwright install --with-deps chromium

      - name: Run full quality gates
        run: bash scripts/eval/full-gates.sh

      - name: Retain coverage and browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-reports
          path: |
            coverage.xml
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
